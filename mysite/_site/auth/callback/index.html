<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrickKeeper</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #faf9f7;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      padding: 40px 32px;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    .brand {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #b51a1e;
      margin-bottom: 24px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #eee;
      border-top-color: #b51a1e;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status {
      font-size: 16px;
      color: #555;
      margin-bottom: 8px;
    }
    .hint {
      font-size: 13px;
      color: #999;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #b51a1e, #d4453a);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      padding: 12px 32px;
      border-radius: 100px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      letter-spacing: 0.5px;
    }
    .btn:active { opacity: 0.85; }
    .fallback { display: none; }
    .fallback.show { display: block; }
    .manual-link {
      display: block;
      margin-top: 16px;
      font-size: 13px;
      color: #b51a1e;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">BRICKKEEPER</div>

    <div id="loading">
      <div class="spinner"></div>
      <p class="status">Redirecting to BrickKeeper...</p>
      <p class="hint">If the app doesn't open automatically, tap the button below.</p>
    </div>

    <div id="fallback" class="fallback">
      <p class="status">Tap the button to open BrickKeeper</p>
      <p class="hint" style="margin-bottom:20px">If you don't have the app installed, please download it from the App Store.</p>
    </div>

    <a id="openBtn" class="btn" href="#">Open BrickKeeper</a>

    <div id="copySection" class="fallback">
      <p class="manual-link">Or copy this link and open in Safari:<br><code id="deepLink"></code></p>
    </div>
  </div>

  <script>
    (function() {
      // Preserve the full hash fragment from Supabase redirect
      var hash = window.location.hash;
      var deepLink = 'brickkeeper://' + hash;

      // Set button href
      var btn = document.getElementById('openBtn');
      btn.href = deepLink;

      // Show the deep link for manual copy
      document.getElementById('deepLink').textContent = deepLink;

      // Try to auto-open the app
      var opened = false;
      window.location.href = deepLink;

      // After 2.5 seconds, show fallback UI
      setTimeout(function() {
        if (!opened) {
          document.getElementById('loading').style.display = 'none';
          document.getElementById('fallback').classList.add('show');
          document.getElementById('copySection').classList.add('show');
        }
      }, 2500);

      // If page becomes hidden, app likely opened
      document.addEventListener('visibilitychange', function() {
        if (document.hidden) { opened = true; }
      });
    })();
  </script>
</body>
</html>
